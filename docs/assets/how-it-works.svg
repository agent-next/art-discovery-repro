<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
  <title id="t">How one task moves through the ART harness</title>
  <desc id="d">A task token travels from the queue to the worker, uses sandbox tools, is sent back once by the supervisor for lacking evidence, is fixed, accepted, filed by the curator into the knowledge base, and a scripted gate then opens the next stage.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .box { fill:#fff; stroke:#cfd6e4; stroke-width:2; }
    .ttl { font-size:17px; font-weight:700; fill:#1d2433; text-anchor:middle; }
    .sub { font-size:12.5px; fill:#6b7488; text-anchor:middle; }
    .arrow { stroke:#c3cbda; stroke-width:3; fill:none; marker-end:url(#ah); }
    .pill { fill:#eef1f7; stroke:#cfd6e4; }
    .pillt { font-size:13px; font-weight:600; fill:#6b7488; text-anchor:middle; }
    .cap { font-size:19px; font-weight:600; fill:#1d2433; text-anchor:middle; opacity:0; }
    .tok { font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; }
    .bub { opacity:0; }
    .bub rect { fill:#fff; stroke-width:2.5; }
    .bub text { font-size:13.5px; font-weight:600; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3cbda"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="16" fill="#f6f8fb"/>

  <!-- stage chain -->
  <g>
    <rect class="pill" x="40" y="22" width="168" height="30" rx="15" style="fill:#e5f6ed;stroke:#1a9d5c"/><text class="pillt" x="124" y="42" style="fill:#1a9d5c">1 Inventory</text>
    <rect class="pill" x="218" y="22" width="168" height="30" rx="15" style="fill:#e5f6ed;stroke:#1a9d5c"/><text class="pillt" x="302" y="42" style="fill:#1a9d5c">2 Sweep</text>
    <rect class="pill" x="396" y="22" width="168" height="30" rx="15" style="fill:#e5f6ed;stroke:#1a9d5c"/><text class="pillt" x="480" y="42" style="fill:#1a9d5c">3 Classify</text>
    <rect class="pill" x="574" y="22" width="168" height="30" rx="15" style="fill:#e6efff;stroke:#2f6fed;stroke-width:2.5"/><text class="pillt" x="658" y="42" style="fill:#2f6fed">4 Census</text>
    <rect class="pill" x="752" y="22" width="208" height="30" rx="15"/><text class="pillt" x="856" y="42">5 Deep dives</text>
    <g fill="#6b7488"><path d="M209,26 h6 v22 h-6z"/><path d="M387,26 h6 v22 h-6z"/><path d="M565,26 h6 v22 h-6z"/><path d="M743,26 h6 v22 h-6z"/></g>
  </g>
  <text class="sub" x="500" y="78">a script-checked gate (the small bars) must pass before the next stage opens</text>

  <!-- stations -->
  <g>
    <rect class="box" x="40" y="160" width="110" height="100" rx="14"/><text class="ttl" x="95" y="195">Queue</text><text class="sub" x="95" y="216">open tasks</text><text class="sub" x="95" y="234">wait here</text>
    <rect class="box" x="230" y="160" width="120" height="100" rx="14"/><text class="ttl" x="290" y="195">Worker</text><text class="sub" x="290" y="216">plans and</text><text class="sub" x="290" y="234">does the work</text>
    <rect class="box" x="430" y="160" width="130" height="100" rx="14"/><text class="ttl" x="495" y="195">Supervisor</text><text class="sub" x="495" y="216">checks every</text><text class="sub" x="495" y="234">claim (code)</text>
    <rect class="box" x="640" y="160" width="110" height="100" rx="14"/><text class="ttl" x="695" y="195">Curator</text><text class="sub" x="695" y="216">files the</text><text class="sub" x="695" y="234">finding</text>
    <rect class="box" x="830" y="160" width="130" height="100" rx="14"/><text class="ttl" x="895" y="195">Knowledge</text><text class="sub" x="895" y="216">base, read by</text><text class="sub" x="895" y="234">later agents</text>
    <rect class="box" x="230" y="330" width="120" height="70" rx="14" style="stroke-dasharray:6 5"/><text class="ttl" x="290" y="360" style="font-size:15px">Sandbox</text><text class="sub" x="290" y="380">tools run here</text>
  </g>
  <path class="arrow" d="M152,210 L226,210"/>
  <path class="arrow" d="M352,210 L426,210"/>
  <path class="arrow" d="M562,210 L636,210"/>
  <path class="arrow" d="M752,210 L826,210"/>
  <path class="arrow" d="M290,262 L290,326"/>
  <path d="M480,158 C450,110 340,110 305,158" fill="none" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="392" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#d64545">revise</text>

  <!-- bubbles -->
  <g class="bub" id="b-tools"><rect x="368" y="335" width="222" height="60" rx="10" style="stroke:#2f6fed"/><text x="380" y="357" style="fill:#2f6fed">scan_arrays result:</text><text x="380" y="378" style="fill:#1d2433;font-weight:500">assessed=8 arrays=4 ...</text>
    <set attributeName="opacity" to="1" begin="s2.begin+0.5s" dur="1.6s"/></g>
  <g class="bub" id="b-bad"><rect x="376" y="268" width="290" height="62" rx="10" style="stroke:#d64545"/><text x="388" y="290" style="fill:#d64545">sent back: no tool result</text><text x="388" y="312" style="fill:#d64545">quoted, so no evidence</text>
    <set attributeName="opacity" to="1" begin="s5.begin+0.2s" dur="1.8s"/></g>
  <g class="bub" id="b-ok"><rect x="430" y="268" width="130" height="34" rx="10" style="stroke:#1a9d5c"/><text x="495" y="291" text-anchor="middle" style="fill:#1a9d5c">&#10003; accepted</text>
    <set attributeName="opacity" to="1" begin="s8.begin" dur="0.9s"/></g>
  <g class="bub" id="b-gate"><rect x="640" y="100" width="320" height="34" rx="10" style="stroke:#1a9d5c"/><text x="800" y="123" text-anchor="middle" style="fill:#1a9d5c">stage done &#8594; script gate passes &#8594; next stage opens</text>
    <set attributeName="opacity" to="1" begin="s10.begin+0.2s" dur="2.6s"/></g>

  <!-- knowledge base entry appears -->
  <circle cx="895" cy="250" r="0" fill="#2f6fed"><animate attributeName="r" values="0;7;7" keyTimes="0;0.1;1" dur="2.8s" begin="s10.begin" fill="freeze"/>
    <set attributeName="r" to="0" begin="s1.begin"/></circle>

  <!-- the task token -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="s1.begin" dur="14.6s"/>
    <circle r="15" cx="0" cy="0" fill="#e08a1e" stroke="#fff" stroke-width="2.5">
      <set attributeName="fill" to="#d64545" begin="s5.begin" dur="1.6s"/>
      <set attributeName="fill" to="#1a9d5c" begin="s8.begin" dur="6s"/>
    </circle>
    <text class="tok" x="0" y="4">t04</text>
    <animateMotion id="s1" path="M95,210 L290,210" dur="1.6s" begin="0s;s10.end+1.6s" fill="freeze"/>
    <animateMotion id="s2" path="M290,210 L290,350" dur="0.8s" begin="s1.end" fill="freeze"/>
    <animateMotion id="s3" path="M290,350 L290,210" dur="0.8s" begin="s2.end+0.6s" fill="freeze"/>
    <animateMotion id="s4" path="M290,210 L495,210" dur="1.4s" begin="s3.end" fill="freeze"/>
    <animateMotion id="s5" path="M495,210 C470,110 320,110 290,210" dur="2s" begin="s4.end+0.3s" fill="freeze"/>
    <animateMotion id="s6" path="M290,210 L290,350" dur="0.8s" begin="s5.end" fill="freeze"/>
    <animateMotion id="s7" path="M290,350 L290,210" dur="0.8s" begin="s6.end+0.4s" fill="freeze"/>
    <animateMotion id="s8" path="M290,210 L495,210" dur="1.4s" begin="s7.end" fill="freeze"/>
    <animateMotion id="s9" path="M495,210 L695,210" dur="1.4s" begin="s8.end+0.9s" fill="freeze"/>
    <animateMotion id="s10" path="M695,210 L895,210" dur="1.4s" begin="s9.end" fill="freeze"/>
  </g>

  <!-- step captions -->
  <g>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s1.begin" dur="1.6s"/>1. A task opens. Its brief, plan and verdicts live in a git folder.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s2.begin" dur="2.2s"/>2. The worker calls tools in a sandbox and writes a summary.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s4.begin" dur="1.7s"/>3. The supervisor checks every claim against the tool log.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s5.begin" dur="2s"/>4. No evidence? Sent back with the exact fix. The worker sees it.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s6.begin" dur="3.4s"/>5. Second pass: the tool result is now quoted word for word.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s8.begin+1.4s" dur="0.9s"/>6. Accepted.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s9.begin" dur="1.4s"/>7. The curator files the finding in the knowledge base.</text>
    <text class="cap" x="500" y="445"><set attributeName="opacity" to="1" begin="s10.begin" dur="3s"/>8. Stage finished: a script, not a model, opens the next stage.</text>
  </g>
</svg>
