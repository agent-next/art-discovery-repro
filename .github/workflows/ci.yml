name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *"  # nightly full suite: the safety net under PR test selection

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # PR head is a merge commit: depth 2 holds it and its base parent
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --locked --python 3.12
      # PRs run only the tests their change can reach; pushes to main and the
      # nightly schedule run everything. A selector failure runs ALL: it must
      # never turn into "no tests".
      - id: affected
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && T=$(python3 scripts/ci/affected.py --base HEAD^1 --format args); then
            echo "tests=$T" >> "$GITHUB_OUTPUT"
          else
            echo "tests=ALL" >> "$GITHUB_OUTPUT"
          fi
      - run: make check TESTS="$TESTS"
        env:
          TESTS: ${{ steps.affected.outputs.tests }}
